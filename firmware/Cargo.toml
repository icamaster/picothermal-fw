# Standalone workspace: cross-compiled, separate build cache from host crates.
[workspace]

[package]
name = "firmware"
description = "RP2040 thermal camera firmware"
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = ["rp2040", "defmt", "time-driver", "critical-section-impl"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
# default-features = false drops the usbd-hid feature, which would pull in
# serde and the HID descriptor macros this device has no use for.
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
static_cell = "2.1.1"
thermal-core = { path = "../crates/thermal-core" }

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"


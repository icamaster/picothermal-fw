<!doctype html>
<!--
  WebUSB web app for the picothermal camera. WebUSB needs a secure context:
  serve it over localhost (python -m http.server 8000 --directory webapp) or
  HTTPS, then open it in Chrome or Edge, desktop or Android.

  The camera streams radiometric Y16 frames (TLinear, centikelvin). All colour
  mapping and ranging happens here, which is why the page never asks the
  firmware for its AGC 8-bit format: that would discard the temperatures the
  legend and spot readout depend on.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>picothermal</title>
<style>
  :root { color-scheme: dark; --fg: #e6e6e6; --muted: #9a9a9a; --panel: #1c1c1c; --line: #333; }
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 1rem; background: #111; color: var(--fg); }
  main { max-width: 640px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .5rem; }
  h1 { font-size: 1.2rem; margin: 0; }
  .version { font-size: .8rem; font-weight: normal; color: var(--muted); margin-left: .4rem; font-variant-numeric: tabular-nums; }
  button, select, input { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: .35rem .6rem; }
  button:disabled, input:disabled { opacity: .45; }
  button[aria-pressed=true] { background: #3a3a3a; border-color: #888; }
  .stepper { display: inline-flex; align-items: center; gap: .35rem; }
  .stepper .name { min-width: 2.2rem; color: var(--muted); }
  .stepper button { min-width: 44px; min-height: 44px; font-size: 1.3rem; line-height: 1; padding: 0; touch-action: manipulation; user-select: none; }
  .stepper input { width: 4.5rem; min-height: 44px; text-align: center; font-variant-numeric: tabular-nums; }

  .view { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; touch-action: none; cursor: crosshair; }
  .view canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .spot { position: absolute; pointer-events: none; transform: translate(-50%, -50%); }
  .spot::before, .spot::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 0 1px #000; }
  .spot::before { width: 18px; height: 2px; left: -9px; top: -1px; }
  .spot::after { width: 2px; height: 18px; left: -1px; top: -9px; }
  .spot span { position: absolute; left: 12px; top: -26px; white-space: nowrap; padding: 1px 5px; background: rgba(0,0,0,.7); border-radius: 3px; font-variant-numeric: tabular-nums; }

  .calibrating { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 3px 10px; background: rgba(0,0,0,.75); border-radius: 3px; pointer-events: none; }

  .legend { margin-top: .5rem; }
  .legend canvas { width: 100%; height: 14px; display: block; border: 1px solid var(--line); }
  .ticks { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; margin-top: 2px; }

  #stats { font-variant-numeric: tabular-nums; color: var(--muted); white-space: pre-wrap; margin-top: .5rem; min-height: 1.2em; }

  .tabs { display: flex; margin-top: .75rem; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: .55rem 0; }
  .tabs button[aria-selected=true] { color: var(--fg); border-bottom-color: var(--fg); }
  .group { padding-top: .25rem; }
  .row { display: grid; grid-template-columns: 6rem 1fr; gap: .5rem; align-items: center; padding: .2rem 0; }
  .row > .label { color: var(--muted); }
  .ctl { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .ctl label { display: inline-flex; gap: .3rem; align-items: center; }
  .hint { color: var(--muted); font-size: 12px; }

  dialog { max-width: min(34rem, calc(100vw - 2rem)); box-sizing: border-box; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 1rem 1.25rem; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { font-size: 1.05rem; margin: 0 0 .5rem; }
  dialog p { margin: .5rem 0; line-height: 1.4; }
  dialog a { color: inherit; }
  dialog pre { background: #111; border: 1px solid var(--line); border-radius: 4px; padding: .5rem; overflow-x: auto; font-size: 12px; margin: .5rem 0; }
  dialog .actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>picothermal<span class="version" id="version"></span></h1>
    <div>
      <button id="save" hidden disabled>Save image</button>
      <button id="connect">Connect</button>
    </div>
  </header>

  <div class="view" id="view">
    <canvas id="image" width="160" height="120"></canvas>
    <div class="spot" id="spot" hidden><span id="spot-label"></span></div>
    <div class="calibrating" id="calibrating" hidden>Calibrating (shutter closed)</div>
  </div>

  <div class="legend">
    <canvas id="legend" width="256" height="1"></canvas>
    <div class="ticks" id="ticks"></div>
  </div>

  <div id="stats">not connected</div>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" aria-controls="tab-display">Display</button>
    <button role="tab" aria-selected="false" aria-controls="tab-measurement">Measurement</button>
    <button role="tab" aria-selected="false" aria-controls="tab-camera">Camera</button>
  </div>

  <section class="group" role="tabpanel" id="tab-display">
    <div class="row">
      <span class="label">Colours</span>
      <div class="ctl"><select id="palette"></select></div>
    </div>
    <div class="row">
      <span class="label">Range</span>
      <div class="ctl">
        <label><input type="radio" name="range" value="auto" checked> Auto</label>
        <label><input type="radio" name="range" value="manual"> Manual</label>
      </div>
    </div>
    <div class="row" id="manual-range" hidden>
      <span class="label"></span>
      <div class="ctl">
        <div class="stepper">
          <span class="name">Min</span>
          <button data-for="min" data-step="-0.5" aria-label="Lower minimum" disabled>&minus;</button>
          <input id="min" type="text" inputmode="decimal" disabled>
          <button data-for="min" data-step="0.5" aria-label="Raise minimum" disabled>+</button>
          <span>&deg;C</span>
        </div>
        <div class="stepper">
          <span class="name">Max</span>
          <button data-for="max" data-step="-0.5" aria-label="Lower maximum" disabled>&minus;</button>
          <input id="max" type="text" inputmode="decimal" disabled>
          <button data-for="max" data-step="0.5" aria-label="Raise maximum" disabled>+</button>
          <span>&deg;C</span>
        </div>
      </div>
    </div>
    <div class="row">
      <span class="label">Average</span>
      <div class="ctl">
        <select id="smoothing">
          <option value="1">Off</option>
          <option value="2">2 frames</option>
          <option value="4">4 frames</option>
          <option value="8">8 frames</option>
        </select>
        <span class="hint">less noise, more motion blur</span>
      </div>
    </div>
    <div class="row">
      <span class="label">Orientation</span>
      <div class="ctl">
        <button id="mirror" aria-pressed="false">Mirror</button>
        <button id="flip" aria-pressed="false">Flip</button>
      </div>
    </div>
  </section>

  <section class="group" role="tabpanel" id="tab-measurement" hidden>
    <div class="row">
      <span class="label">Spot</span>
      <div class="ctl">
        <button id="clear-spot" disabled>Clear</button>
        <span class="hint">tap the image to place one</span>
      </div>
    </div>
    <div class="row">
      <span class="label">Emissivity</span>
      <div class="ctl">
        <div class="stepper">
          <button data-for="emissivity" data-step="-0.01" aria-label="Lower emissivity" disabled>&minus;</button>
          <input id="emissivity" type="text" inputmode="decimal" value="1.00" disabled>
          <button data-for="emissivity" data-step="0.01" aria-label="Raise emissivity" disabled>+</button>
        </div>
        <select id="material" aria-label="Emissivity preset" disabled>
          <option value="">Preset&hellip;</option>
          <option value="1.00">Ideal black body (1.00)</option>
          <option value="0.98">Skin, water (0.98)</option>
          <option value="0.95">Matte paint, plastic, tape (0.95)</option>
          <option value="0.93">Brick, concrete (0.93)</option>
          <option value="0.90">Wood, paper (0.90)</option>
          <option value="0.80">Oxidised steel (0.80)</option>
          <option value="0.30">Dull aluminium (0.30)</option>
        </select>
      </div>
    </div>
  </section>

  <section class="group" role="tabpanel" id="tab-camera" hidden>
    <div class="row">
      <span class="label">Gain</span>
      <div class="ctl">
        <select id="gain" disabled>
          <option value="0">High (&minus;10 to 140 &deg;C)</option>
          <option value="1">Low (up to about 380 &deg;C)</option>
          <option value="2">Auto</option>
        </select>
      </div>
    </div>
    <div class="row">
      <span class="label">Calibration</span>
      <div class="ctl">
        <button id="calibrate" disabled>Calibrate now</button>
        <span class="hint">also runs by itself every few minutes</span>
      </div>
    </div>
    <div class="row">
      <span class="label">Firmware</span>
      <div class="ctl">
        <button id="update" disabled>Update&hellip;</button>
        <span class="hint">restarts the camera as a USB drive</span>
      </div>
    </div>
  </section>
</main>

<dialog id="notice">
  <div id="notice-body"></div>
  <form method="dialog" class="actions">
    <button id="notice-mute" value="mute" hidden>Don't show again</button>
    <button value="close" autofocus>OK</button>
  </form>
</dialog>

<script>
const VID = 0x1209, PID = 0x0001;
const WIDTH = 160, HEIGHT = 120, HEADER_LEN = 16;
const MAX_TRANSFER = HEADER_LEN + WIDTH * HEIGHT * 2;
const FORMAT_Y16 = 0;
const FLAG_FFC = 1 << 0;
const TICKS = 5;

// Host commands: opcode, then a little-endian 16-bit argument.
const CMD_SET_GAIN = 0x02, CMD_RUN_FFC = 0x03, CMD_SET_EMISSIVITY = 0x04, CMD_REBOOT_TO_BOOTLOADER = 0x05;
const EMISSIVITY_ONE = 8192;  // the camera's fixed-point 1.0

// Each palette is a list of evenly spaced colour stops, expanded into a
// 256-entry lookup table once.
const PALETTES = {
  'Ironbow':     [[0,0,0],[32,0,140],[140,0,160],[220,40,90],[255,120,0],[255,200,30],[255,255,220]],
  'Inferno':     [[0,0,4],[40,11,84],[101,21,110],[159,42,99],[212,72,66],[245,125,21],[250,193,39],[252,255,164]],
  'Rainbow':     [[0,0,140],[0,60,255],[0,220,255],[40,255,80],[255,240,0],[255,100,0],[200,0,0]],
  'White hot':   [[0,0,0],[255,255,255]],
  'Black hot':   [[255,255,255],[0,0,0]],
};

const $ = (id) => document.getElementById(id);
const ctx = $('image').getContext('2d');
const image = ctx.createImageData(WIDTH, HEIGHT);
const legendCtx = $('legend').getContext('2d');

let device, epIn, epOut;
let lut;                          // Uint8Array, 256 * 3
let celsius = null;               // Float32Array of the latest frame, for spot lookups
let spot = null;                  // { x, y } in sensor pixels
let auto = { lo: null, hi: null };// smoothed auto range, so the scale doesn't flicker
let frames = 0, dropped = 0, lastSeq = null, since = performance.now();

function buildLut(stops) {
  const table = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const pos = (i / 255) * (stops.length - 1);
    const a = Math.floor(pos), b = Math.min(a + 1, stops.length - 1), t = pos - a;
    for (let c = 0; c < 3; c++) table[i * 3 + c] = Math.round(stops[a][c] + (stops[b][c] - stops[a][c]) * t);
  }
  return table;
}

function setPalette(name) {
  lut = buildLut(PALETTES[name]);
  const bar = legendCtx.createImageData(256, 1);
  for (let i = 0; i < 256; i++) {
    bar.data.set([lut[i * 3], lut[i * 3 + 1], lut[i * 3 + 2], 255], i * 4);
  }
  legendCtx.putImageData(bar, 0, 0);
  if (celsius) render();
}

for (const name of Object.keys(PALETTES)) $('palette').add(new Option(name, name));
$('palette').onchange = (e) => setPalette(e.target.value);
setPalette('Ironbow');

// Range controls. Switching to manual starts from whatever auto was showing,
// so the image doesn't jump.
const isManual = () => document.querySelector('input[name=range]:checked').value === 'manual';
for (const radio of document.querySelectorAll('input[name=range]')) {
  radio.onchange = () => {
    const manual = isManual();
    $('manual-range').hidden = !manual;
    for (const el of document.querySelectorAll('#min, #max, [data-for=min], [data-for=max]')) el.disabled = !manual;
    if (manual && auto.lo !== null) {
      $('min').value = auto.lo.toFixed(1);
      $('max').value = auto.hi.toFixed(1);
    }
    if (celsius) render();
  };
}
$('min').oninput = $('max').oninput = () => celsius && render();

// Accept a decimal comma too, since phone keypads in many locales offer only
// that.
const readValue = (id) => parseFloat($(id).value.replace(',', '.'));

// Stepper buttons: one step per tap, repeating while held. Min is kept at
// least one step below max so the range never inverts; emissivity stays
// within what the camera accepts.
const STEP_GAP = 0.5;
function step(button) {
  const id = button.dataset.for, delta = parseFloat(button.dataset.step);
  let value = readValue(id);
  if (!Number.isFinite(value)) value = id === 'emissivity' ? 1 : 0;
  value += delta;
  if (id === 'emissivity') {
    $(id).value = clampEmissivity(value).toFixed(2);
    emissivityChanged();
    return;
  }
  if (id === 'min') value = Math.min(value, readValue('max') - STEP_GAP);
  else value = Math.max(value, readValue('min') + STEP_GAP);
  $(id).value = value.toFixed(1);
  if (celsius) render();
}
for (const button of document.querySelectorAll('.stepper button')) {
  let delay, repeat;
  const stop = () => { clearTimeout(delay); clearInterval(repeat); };
  button.addEventListener('pointerdown', (e) => {
    if (button.disabled) return;
    e.preventDefault();
    step(button);
    delay = setTimeout(() => { repeat = setInterval(() => step(button), 80); }, 400);
  });
  for (const type of ['pointerup', 'pointerleave', 'pointercancel']) button.addEventListener(type, stop);
}

// Settings tabs: one group at a time, so the page fits a phone screen.
const tabs = document.querySelectorAll('[role=tab]');
function selectTab(panelId) {
  for (const tab of tabs) {
    const selected = tab.getAttribute('aria-controls') === panelId;
    tab.setAttribute('aria-selected', selected);
    $(tab.getAttribute('aria-controls')).hidden = !selected;
  }
  try { localStorage.setItem('tab', panelId); } catch {}
}
for (const tab of tabs) tab.onclick = () => selectTab(tab.getAttribute('aria-controls'));
try {
  const saved = localStorage.getItem('tab');
  if (saved && $(saved)) selectTab(saved);
} catch {}

// Camera settings. The camera forgets them when it loses power, so they are
// remembered here and sent again on every connect.
const camera = { gain: 0, emissivity: 1 };
try { Object.assign(camera, JSON.parse(localStorage.getItem('camera') || '{}')); } catch {}
const saveCamera = () => { try { localStorage.setItem('camera', JSON.stringify(camera)); } catch {} };
const clampEmissivity = (value) => Math.min(1, Math.max(0.01, Math.round(value * 100) / 100));
$('gain').value = String(camera.gain);
$('emissivity').value = camera.emissivity.toFixed(2);

async function send(opcode, argument = 0) {
  if (!device || epOut === undefined) return;
  try {
    await device.transferOut(epOut, new Uint8Array([opcode, argument & 0xff, argument >> 8]));
  } catch (err) {
    $('stats').textContent = `command failed: ${err.message}`;
  }
}
const sendGain = () => send(CMD_SET_GAIN, camera.gain);
const sendEmissivity = () => send(CMD_SET_EMISSIVITY, Math.round(camera.emissivity * EMISSIVITY_ONE));

$('gain').onchange = () => {
  camera.gain = Number($('gain').value);
  saveCamera();
  sendGain();
  // A new gain changes every reading, so averaged history would blend two
  // calibrations.
  resetSmoothing();
};
$('calibrate').onclick = () => send(CMD_RUN_FFC);

// Updating uses the RP2040's ROM bootloader rather than streaming the image
// over WebUSB: the ROM cannot be overwritten, so a failed copy never leaves a
// camera that cannot be updated again.
const RELEASES = 'https://github.com/icamaster/picothermal-fw/releases/latest';
$('update').onclick = async () => {
  if (!confirm('Restart the camera into its USB bootloader to install new firmware? Streaming stops until the update is done.')) return;
  await send(CMD_REBOOT_TO_BOOTLOADER);
  showNotice(
    '<h2>Install the new firmware</h2>' +
      `<p>1. Download the <code>.uf2</code> file from the <a href="${RELEASES}" target="_blank" rel="noopener">latest release</a>.</p>` +
      '<p>2. Copy it onto the <code>RPI-RP2</code> drive the camera now shows up as. The camera restarts by itself once the copy finishes.</p>' +
      '<p>3. Press Connect again.</p>' +
      '<p>No drive? On Android, only phones that support USB drives show it. If the camera is still streaming, its firmware predates this button: hold BOOTSEL while plugging it in instead.</p>',
    false,
  );
};

// Holding a stepper button repeats quickly; only the value it settles on needs
// to reach the camera.
let emissivityTimer;
function emissivityChanged() {
  const value = clampEmissivity(readValue('emissivity'));
  if (!Number.isFinite(value)) return;
  camera.emissivity = value;
  $('material').value = '';
  saveCamera();
  clearTimeout(emissivityTimer);
  emissivityTimer = setTimeout(sendEmissivity, 300);
}
$('emissivity').onchange = () => {
  $('emissivity').value = clampEmissivity(readValue('emissivity') || 1).toFixed(2);
  emissivityChanged();
};
$('material').onchange = () => {
  const preset = $('material').value;
  if (!preset) return;
  $('emissivity').value = preset;
  emissivityChanged();
  $('material').value = preset;
};

// Temporal smoothing: the displayed frame is the average of the last N, which
// cuts noise by about the square root of N at the cost of motion blur.
let smoothing = 1, recent = [], recentSum = null;
try { smoothing = Number(localStorage.getItem('smoothing')) || 1; } catch {}
$('smoothing').value = String(smoothing);
function resetSmoothing() { recent = []; recentSum = null; }
$('smoothing').onchange = () => {
  smoothing = Number($('smoothing').value);
  try { localStorage.setItem('smoothing', String(smoothing)); } catch {}
  resetSmoothing();
};
function smooth(frame) {
  if (smoothing <= 1) return frame;
  if (!recentSum) recentSum = new Float32Array(frame.length);
  recent.push(frame);
  for (let i = 0; i < frame.length; i++) recentSum[i] += frame[i];
  while (recent.length > smoothing) {
    const old = recent.shift();
    for (let i = 0; i < old.length; i++) recentSum[i] -= old[i];
  }
  const out = new Float32Array(frame.length);
  for (let i = 0; i < out.length; i++) out[i] = recentSum[i] / recent.length;
  return out;
}

// Spot placement, in sensor pixels so it stays on the same point of the scene.
// Mirror and flip are a CSS transform on the image canvas, done by the
// browser's compositor, so they cost no per-pixel work here or on the camera.
// The spot is stored in sensor pixels, so clicks and the marker are mapped
// through the same transform; the marker's label stays readable.
const orientation = { mirror: false, flip: false };
try { Object.assign(orientation, JSON.parse(localStorage.getItem('orientation') || '{}')); } catch {}
const toDisplayX = (x) => (orientation.mirror ? WIDTH - 1 - x : x);
const toDisplayY = (y) => (orientation.flip ? HEIGHT - 1 - y : y);
function applyOrientation() {
  $('image').style.transform = `scale(${orientation.mirror ? -1 : 1}, ${orientation.flip ? -1 : 1})`;
  $('mirror').setAttribute('aria-pressed', orientation.mirror);
  $('flip').setAttribute('aria-pressed', orientation.flip);
  try { localStorage.setItem('orientation', JSON.stringify(orientation)); } catch {}
  if (celsius) render();
}
$('mirror').onclick = () => { orientation.mirror = !orientation.mirror; applyOrientation(); };
$('flip').onclick = () => { orientation.flip = !orientation.flip; applyOrientation(); };
applyOrientation();

$('view').addEventListener('pointerdown', (e) => {
  const box = $('view').getBoundingClientRect();
  // The same mapping undoes itself, so display to sensor uses it too.
  spot = {
    x: toDisplayX(Math.min(WIDTH - 1, Math.max(0, Math.floor(((e.clientX - box.left) / box.width) * WIDTH)))),
    y: toDisplayY(Math.min(HEIGHT - 1, Math.max(0, Math.floor(((e.clientY - box.top) / box.height) * HEIGHT)))),
  };
  $('clear-spot').disabled = false;
  if (celsius) render();
});
$('clear-spot').onclick = () => {
  spot = null;
  $('spot').hidden = true;
  $('clear-spot').disabled = true;
};

$('connect').onclick = async () => {
  try {
    device = await navigator.usb.requestDevice({ filters: [{ vendorId: VID, productId: PID }] });
    await device.open();
    if (device.configuration === null) await device.selectConfiguration(1);
    const iface = device.configuration.interfaces[0];
    await device.claimInterface(iface.interfaceNumber);

    // Endpoint numbers are assigned by the device, so read them off the
    // descriptor instead of assuming EP1.
    epIn = iface.alternate.endpoints.find((ep) => ep.direction === 'in').endpointNumber;
    epOut = iface.alternate.endpoints.find((ep) => ep.direction === 'out').endpointNumber;

    // The firmware reports its own version as the USB device release, so this
    // is always the version actually running on the camera.
    $('version').textContent = `v${device.deviceVersionMajor}.${device.deviceVersionMinor}.${device.deviceVersionSubminor}`;

    // Connected: Connect has nothing left to do, and saving only makes sense
    // with a camera streaming. Both swap back if the device disconnects.
    $('connect').hidden = true;
    $('save').hidden = false;
    for (const el of document.querySelectorAll('#gain, #calibrate, #update, #emissivity, #material, [data-for=emissivity]')) el.disabled = false;
    if (camera.gain !== 0) sendGain();
    if (camera.emissivity !== 1) sendEmissivity();
    keepAwake();
    stream();
  } catch (err) {
    $('stats').textContent = `connect failed: ${err.message}`;
  }
};

// A phone would otherwise dim and lock mid-stream, since watching the image
// involves no touches. The browser drops the lock whenever the page is hidden,
// so it has to be requested again on return.
let wakeLock = null;
async function keepAwake() {
  if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch {
    // Refused, e.g. battery saver on: the page still works, the screen just sleeps.
  }
}
document.addEventListener('visibilitychange', () => { if ($('connect').hidden) keepAwake(); });

async function stream() {
  for (;;) {
    let result;
    try {
      result = await device.transferIn(epIn, MAX_TRANSFER);
    } catch (err) {
      $('stats').textContent = `disconnected: ${err.message}`;
      $('connect').hidden = false;
      $('save').hidden = true;
      wakeLock?.release();
      return;
    }
    if (result.status === 'ok' && result.data.byteLength >= HEADER_LEN) receive(result.data);
  }
}

function receive(view) {
  const magic = String.fromCharCode(...new Uint8Array(view.buffer, view.byteOffset, 4));
  if (magic !== 'THRM') { $('stats').textContent = `bad magic ${magic}`; return; }

  const format = view.getUint8(5);
  const width = view.getUint16(6, true), height = view.getUint16(8, true);
  const seq = view.getUint32(10, true);
  const flags = view.getUint8(14);
  if (format !== FORMAT_Y16 || width !== WIDTH || height !== HEIGHT) {
    $('stats').textContent = `unexpected frame: format ${format}, ${width}x${height}`;
    return;
  }

  // During a flat-field correction the camera shows its closed shutter. Keep
  // the last real frame and range on screen instead, so the image and the auto
  // range don't jump to a flat grey field and back.
  const calibrating = (flags & FLAG_FFC) !== 0;
  $('calibrating').hidden = !calibrating;
  if (calibrating) {
    // A correction shifts every reading, so frames from before it must not be
    // averaged with frames after.
    resetSmoothing();
  } else {
    // Centikelvin to Celsius.
    const frame = new Float32Array(WIDTH * HEIGHT);
    for (let i = 0; i < frame.length; i++) {
      frame[i] = view.getUint16(HEADER_LEN + i * 2, true) / 100 - 273.15;
    }
    celsius = smooth(frame);
    render();
  }

  if (lastSeq !== null && seq !== ((lastSeq + 1) >>> 0)) dropped++;
  lastSeq = seq;
  frames++;
  const elapsed = (performance.now() - since) / 1000;
  if (elapsed >= 1 && celsius) {
    let lo = Infinity, hi = -Infinity;
    for (const t of celsius) { if (t < lo) lo = t; if (t > hi) hi = t; }
    $('stats').textContent =
      `${(frames / elapsed).toFixed(1)} fps   dropped ${dropped}   ` +
      `scene ${lo.toFixed(1)} to ${hi.toFixed(1)} °C`;
    frames = 0;
    since = performance.now();
  }
}

function currentRange() {
  if (isManual()) {
    const lo = readValue('min'), hi = readValue('max');
    if (Number.isFinite(lo) && Number.isFinite(hi) && hi > lo) return { lo, hi };
  }
  let lo = Infinity, hi = -Infinity;
  for (const t of celsius) { if (t < lo) lo = t; if (t > hi) hi = t; }
  // Ease toward the frame's range rather than jumping to it, and keep at
  // least a 2 degree span so a flat scene isn't stretched into pure noise.
  const mid = (lo + hi) / 2;
  if (hi - lo < 2) { lo = mid - 1; hi = mid + 1; }
  const k = auto.lo === null ? 1 : 0.2;
  auto.lo = auto.lo === null ? lo : auto.lo + (lo - auto.lo) * k;
  auto.hi = auto.hi === null ? hi : auto.hi + (hi - auto.hi) * k;
  return { lo: auto.lo, hi: auto.hi };
}

let shownRange = null;  // the range the last render used, for the saved image's legend

function render() {
  const { lo, hi } = currentRange();
  shownRange = { lo, hi };
  $('save').disabled = false;
  const scale = 255 / (hi - lo);
  const px = image.data;
  for (let i = 0; i < celsius.length; i++) {
    const v = Math.max(0, Math.min(255, Math.round((celsius[i] - lo) * scale))) * 3;
    px[i * 4] = lut[v];
    px[i * 4 + 1] = lut[v + 1];
    px[i * 4 + 2] = lut[v + 2];
    px[i * 4 + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);

  const ticks = [];
  for (let i = 0; i < TICKS; i++) ticks.push(`<span>${(lo + ((hi - lo) * i) / (TICKS - 1)).toFixed(1)} &deg;C</span>`);
  $('ticks').innerHTML = ticks.join('');

  if (spot) {
    const el = $('spot');
    el.hidden = false;
    const dx = toDisplayX(spot.x), dy = toDisplayY(spot.y);
    el.style.left = `${((dx + 0.5) / WIDTH) * 100}%`;
    el.style.top = `${((dy + 0.5) / HEIGHT) * 100}%`;
    const label = $('spot-label');
    label.textContent = `${celsius[spot.y * WIDTH + spot.x].toFixed(1)} °C`;
    // Keep the label on the image when the spot is near the right edge.
    label.style.left = dx > WIDTH * 0.75 ? 'auto' : '12px';
    label.style.right = dx > WIDTH * 0.75 ? '12px' : 'auto';
  }
}

// Save image: the current frame redrawn off screen at 4x with its spot, the
// temperature legend and a footer of settings, so a saved picture can still be
// read later. Drawn by hand rather than captured from the page, which browsers
// cannot do without a large library, and which would also miss the mirror/flip
// transform and the positioned spot label.
const SAVE_SCALE = 4;
const GAIN_NAMES = ['High', 'Low', 'Auto'];

function saveImage() {
  if (!celsius || !shownRange) return;
  const { lo, hi } = shownRange;
  const w = WIDTH * SAVE_SCALE, h = HEIGHT * SAVE_SCALE;
  const legendTop = h + 12, legendHeight = 16, footerTop = legendTop + legendHeight + 30;

  const out = document.createElement('canvas');
  out.width = w;
  out.height = footerTop + 48;
  const c = out.getContext('2d');
  c.fillStyle = '#111';
  c.fillRect(0, 0, out.width, out.height);

  // The frame, nearest-neighbour so pixels stay sharp, oriented like the screen.
  const frame = document.createElement('canvas');
  frame.width = WIDTH;
  frame.height = HEIGHT;
  frame.getContext('2d').putImageData(image, 0, 0);
  c.imageSmoothingEnabled = false;
  c.save();
  c.translate(orientation.mirror ? w : 0, orientation.flip ? h : 0);
  c.scale(orientation.mirror ? -1 : 1, orientation.flip ? -1 : 1);
  c.drawImage(frame, 0, 0, w, h);
  c.restore();

  c.font = '15px system-ui, sans-serif';
  c.textBaseline = 'middle';

  if (spot) {
    const x = (toDisplayX(spot.x) + 0.5) * SAVE_SCALE, y = (toDisplayY(spot.y) + 0.5) * SAVE_SCALE;
    c.fillStyle = '#000';
    c.fillRect(x - 13, y - 2, 26, 4);
    c.fillRect(x - 2, y - 13, 4, 26);
    c.fillStyle = '#fff';
    c.fillRect(x - 12, y - 1, 24, 2);
    c.fillRect(x - 1, y - 12, 2, 24);
    const label = `${celsius[spot.y * WIDTH + spot.x].toFixed(1)} \u00b0C`;
    const width = c.measureText(label).width + 10;
    const onLeft = x + 16 + width > w;
    const lx = onLeft ? x - 16 - width : x + 16, ly = Math.max(12, y - 22);
    c.fillStyle = 'rgba(0,0,0,.7)';
    c.fillRect(lx, ly - 11, width, 22);
    c.fillStyle = '#fff';
    c.fillText(label, lx + 5, ly);
  }

  // Legend: the colour bar the image was rendered with, and its range.
  for (let x = 0; x < w; x++) {
    const v = Math.round((x / (w - 1)) * 255) * 3;
    c.fillStyle = `rgb(${lut[v]},${lut[v + 1]},${lut[v + 2]})`;
    c.fillRect(x, legendTop, 1, legendHeight);
  }
  c.fillStyle = '#9a9a9a';
  for (let i = 0; i < TICKS; i++) {
    const t = `${(lo + ((hi - lo) * i) / (TICKS - 1)).toFixed(1)} \u00b0C`;
    const tw = c.measureText(t).width;
    const x = i === 0 ? 0 : i === TICKS - 1 ? w - tw : (w * i) / (TICKS - 1) - tw / 2;
    c.fillText(t, x, legendTop + legendHeight + 14);
  }

  // Footer: what was being looked at, and how.
  let sceneLo = Infinity, sceneHi = -Infinity;
  for (const t of celsius) { if (t < sceneLo) sceneLo = t; if (t > sceneHi) sceneHi = t; }
  const now = new Date();
  const version = $('version').textContent;
  c.fillStyle = '#e6e6e6';
  c.fillText(`picothermal ${version}   ${now.toLocaleString()}`, 0, footerTop);
  c.fillStyle = '#9a9a9a';
  c.fillText(
    `Scene ${sceneLo.toFixed(1)} to ${sceneHi.toFixed(1)} \u00b0C   ` +
      `Emissivity ${camera.emissivity.toFixed(2)}   Gain ${GAIN_NAMES[camera.gain] ?? '?'}   ` +
      `${isManual() ? 'Manual' : 'Auto'} range   ${$('palette').value}`,
    0,
    footerTop + 24,
  );

  const pad = (n) => String(n).padStart(2, '0');
  const name = `picothermal-${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}-` +
    `${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.png`;
  out.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    link.click();
    // The click starts the download asynchronously; release the blob after.
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }, 'image/png');
}
$('save').onclick = saveImage;

// Platform check on load. WebUSB is Chromium-only, and on Linux the browser can
// list the camera yet fail to open it, because the device node is root-owned
// until a udev rule grants it to the desktop user. Both look like a broken
// camera, so say so before the user ever presses Connect.
const README_PLATFORMS = 'https://github.com/icamaster/picothermal-fw#platforms';
const LINUX_NOTICE_KEY = 'picothermal.hideLinuxNotice';

function showNotice(html, mutable) {
  const dialog = $('notice');
  $('notice-body').innerHTML = html;
  $('notice-mute').hidden = !mutable;
  if (dialog.showModal) dialog.showModal(); else dialog.setAttribute('open', '');
}

function checkPlatform() {
  const ua = navigator.userAgent;
  // iPadOS reports itself as a Mac, so a touch screen gives it away.
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  if (!('usb' in navigator)) {
    let why;
    if (ios) {
      why = 'Every browser on iPhone and iPad runs on Safari\'s engine, which does not implement WebUSB, and iOS does not let apps talk to USB devices like this camera.';
    } else if (!window.isSecureContext) {
      why = 'WebUSB only works on pages served over HTTPS or from localhost, and this page was opened some other way.';
    } else {
      why = 'This browser does not implement WebUSB. Use a Chromium-based browser such as Chrome, Edge, Opera or Brave, on Windows, macOS, Linux, ChromeOS or Android.';
    }
    showNotice(
      `<h2>The camera won't work here</h2><p>${why}</p>` +
        `<p>See <a href="${README_PLATFORMS}" target="_blank" rel="noopener">supported platforms</a> for the full list.</p>`,
      false,
    );
    $('connect').disabled = true;
    $('stats').textContent = 'WebUSB is not available in this browser';
    return;
  }

  let hidden = false;
  try { hidden = localStorage.getItem(LINUX_NOTICE_KEY) === '1'; } catch { /* storage blocked */ }
  if (/Linux/.test(ua) && !/Android|CrOS/.test(ua) && !hidden) {
    const hex = (n) => n.toString(16).padStart(4, '0');
    const rule = `SUBSYSTEM=="usb", ATTR{idVendor}=="${hex(VID)}", ATTR{idProduct}=="${hex(PID)}", TAG+="uaccess"`;
    showNotice(
      '<h2>One-time setup on Linux</h2>' +
        '<p>Linux only lets root open USB devices by default, so the browser can list the camera but fail to connect. ' +
        'Allow it for your desktop user by creating <code>/etc/udev/rules.d/50-picothermal.rules</code> containing:</p>' +
        `<pre>${rule}</pre>` +
        '<p>Then unplug and replug the camera. Already done? Choose "Don\'t show again".</p>' +
        `<p><a href="${README_PLATFORMS}" target="_blank" rel="noopener">More about supported platforms</a></p>`,
      true,
    );
  }
}

$('notice').addEventListener('close', () => {
  if ($('notice').returnValue === 'mute') {
    try { localStorage.setItem(LINUX_NOTICE_KEY, '1'); } catch { /* storage blocked: it just shows again */ }
  }
});
checkPlatform();
</script>
</body>
</html>

[workspace]
resolver = "3"
members = ["crates/thermal-core"]
# The firmware is its own workspace: it cross-compiles to thumbv6m-none-eabi
# and must not share the host build cache or feature unification with these crates.
exclude = ["firmware"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
